---
layout: sheet
---
<article class="doc">
  {% unless page.hidetitle %}
  <header class="doc-head">
    <h1>{{ page.title }}</h1>
  </header>
  {% endunless %}
  <div class="article-wrap doc-body">
    {% include _figures.html html=content %}
  </div>
  {% if site.owner.disqus-shortname and page.comments == true %}
  <footer class="doc-end">
    <section class="doc-comments">
      <h2 class="doc-end-head">Comments</h2>
      <div id="disqus_thread"></div>
      {% include _disqus_comments.html %}
    </section>
  </footer>
  {% endif %}
</article>
