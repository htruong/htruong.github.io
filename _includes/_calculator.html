{% comment %} A pocket scientific calculator, left upside down on the desk {% endcomment %}
<div class="prop calc" aria-hidden="true">
  <div class="calc-window">{% include _led.html %}</div>
  <div class="calc-keys">
    <i>x<sup>y</sup></i><i>log</i><i>ln</i><i>e<sup>x</sup></i><i>CLR</i>
    <i>&radic;x</i><i>arc</i><i>sin</i><i>cos</i><i>tan</i>
    <i>1/x</i><i>x&#x21C6;y</i><i>R&darr;</i><i>STO</i><i>RCL</i>
    <i class="enter">Enter&uarr;</i><i>CHS</i><i>EEX</i><i>CLx</i>
    <i class="op">&minus;</i><i class="n">7</i><i class="n">8</i><i class="n">9</i>
    <i class="op">+</i><i class="n">4</i><i class="n">5</i><i class="n">6</i>
    <i class="op">&times;</i><i class="n">1</i><i class="n">2</i><i class="n">3</i>
    <i class="op">&divide;</i><i class="n">0</i><i class="n">.</i><i class="n">&pi;</i>
  </div>
  <span class="calc-badge">Hewlett&middot;Packard</span>
</div>
